# 单体集成测试环境（moyue-app）：
# - 单体已移除 Nacos 注册/发现与 Gateway，测试上下文不依赖注册中心
# - 数据源为 H2 内存库（MySQL 兼容模式），替代 Testcontainers MySQL：
#   项目硬性约束禁用 Docker（见 docs/不可忽视条件.md），集成测试一律走 H2
# - Flyway 挂载 classpath:db/h2（由 tools/gen-h2-schema.py 从真实迁移脚本生成的 H2 等价 schema），
#   与生产的 classpath:db/migration 隔离：真实脚本含 MySQL 按表作用域的重名索引，
#   H2 索引名 schema 全局唯一会冲突，故测试侧用变换后的等价脚本
# - Redis / ES 客户端为惰性连接，测试链路不触碰真实实例，无需运行
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:moyue_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=20000;NON_KEYWORDS=USER
    username: sa
    password: ''
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/h2
  elasticsearch:
    uris: http://localhost:9200
  # 单体集成测试环境无运行中的 Elasticsearch（项目硬性约束禁用 Docker，QA 约定 ES 用 mock 单测）。
  # Spring Data ES 仓储会在上下文启动时 eager 连接 ES，因 Connection refused 导致全部 @SpringBootTest
  # 上下文加载失败；此处仅关闭“仓储”自动配置，保留惰性 ES 客户端，由 ElasticsearchMockRepositoriesConfig
  # 以 Mockito 桩替换三个仓储接口，业务链路不触碰真实实例。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration

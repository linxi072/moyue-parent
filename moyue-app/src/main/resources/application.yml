server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moyue}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 账号口令不设明文默认值，强制由环境变量注入；本地 dev 下沉默认值便于直接启动
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

moyue:
  # 缓存总开关（置 false 即全站关闭缓存，自动回源数据库）
  cache:
    enabled: true
  jwt:
    # 密钥环境变量化；test/prod 必须注入 MOYUE_JWT_SECRET
    secret: ${MOYUE_JWT_SECRET:moyue-jwt-dev-secret-key-0123456789abcdefghij}
    access-ttl: 7200000
    refresh-ttl: 604800000
  security:
    # 网关直连防护：允许直连业务端口的来源网段（CIDR）；留空=no-op（本地/H2 测试）
    allowGatewayCidr: ""
    enforceSourceCheck: false
    # 网关信任头 HMAC 签名密钥；留空=不签名（no-op）
    gatewaySigSecret: ""
    internalToken: ${MOYUE_INTERNAL_TOKEN:dev-internal-token}
  storage:
    local:
      root: ./uploads
      url-prefix: /api/v1/files
    max-size-mb: 5
  tts:
    endpoint: ${MOYUE_TTS_ENDPOINT:}
    secret: ${MOYUE_TTS_SECRET:}
    default-voice: zh-CN-XiaoxiaoNeural
    segment-max-chars: 200
  demo:
    phone: "13800000000"
    password: "123456"
    nickname: "墨阅读者"
    role: 1

# XXL-Job 执行器（随单体进程启动，RPC 端口 9099）
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
      username: ${XXL_JOB_ADMIN_USERNAME:admin}
      password: ${XXL_JOB_ADMIN_PASSWORD:123456}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:moyue-job}
      address: ""
      ip: ""
      port: 9099
      logpath: ./logs/xxl-job
      logretentiondays: 30

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.moyue: INFO

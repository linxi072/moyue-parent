version: "3.8"

# 墨阅小说网本地依赖（开发联调一键启动）
# 启动：docker compose up -d
# 停止：docker compose down
services:
  mysql:
    image: mysql:8.0
    container_name: moyue-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moyue
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - moyue-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: moyue-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: moyue-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/health/check"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Elasticsearch：检索域（moyue-search）全文检索索引 moyue_book（P2-13）
  # 单节点、关闭安全认证，供本地开箱联调；生产请启用 xpack.security 并外置密钥。
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: moyue-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - moyue-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # MailHog：触达域（承载于 moyue-reader）本地邮件验证（SMTP 1025 / WebUI 8025）；生产由运维注入真实 SMTP。
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: moyue-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  moyue-mysql-data:
  moyue-es-data:

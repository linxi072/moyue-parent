        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/audit/tasks/{taskId}/reject:
    put:
      tags: [admin]
      summary: 审核驳回（回写：章节→3 已驳回 / 评论→2 已驳回）
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/announcements:
    get:
      tags: [admin]
      summary: 公告列表（可按 status 过滤：0 草稿 / 1 已发布 / 2 已下线）
      parameters:
        - { name: status, in: query, schema: { type: integer, enum: [0, 1, 2] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }
    post:
      tags: [admin]
      summary: 发布公告（支持定时上线与置顶）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/announcements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [admin]
      summary: 编辑公告（仅更新非空字段）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    delete:
      tags: [admin]
      summary: 删除公告（逻辑删除）
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/orders:
    get:
      tags: [admin]
      summary: 打赏订单分页（运营对账）
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }

  /admin/stats/overview:
    get:
      tags: [admin]
      summary: 全站聚合统计（只读）
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/stats/authors:
    get:
      tags: [admin]
      summary: 作者维度统计分页（昵称模糊匹配 + 作品数 / 字数 / 收入聚合）
      parameters:
        - { name: keyword, in: query, required: false, schema: { type: string }, description: 昵称模糊匹配 }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }

  /admin/stats/retention:
    get:
      tags: [admin]
      summary: 留存漏斗（registered / activated / paying / active7d 及派生比率）
      description: 比率字段为**整数百分比**（0~100），非小数。
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/stats/export:
    get:
      tags: [admin]
      summary: 明细导出 CSV（authors / retention）
      description: |
        **本端点刻意不走 `R<T>` 信封**：直接返回带 UTF-8 BOM 的 `text/csv` 字节流，
        并设置 `Content-Disposition: attachment` 触发浏览器另存。
        若前端按 JSON 解析会失败——请以 `responseType: 'blob'` 处理。

        `type` 仅接受 `authors` / `retention` 两个枚举值（Service 侧白名单二次校验），
        防止用户输入污染 `Content-Disposition` 响应头（响应头注入防护）。
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [authors, retention] } }
      responses:
        "200":
          description: CSV 文件流
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /admin/points/products:

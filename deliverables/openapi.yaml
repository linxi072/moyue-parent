openapi: 3.0.3

info:
  title: 墨阅小说网 API
  version: 2.3.0
  description: |
    免费读书网站「墨阅小说网」后端接口契约（OpenAPI 3.0）。

    **    本契约于 2026-09-12 与工程源码对齐**：共 130 个 REST 端点（另有 1 个 WebSocket
    `/ws/im`），由脚本从全部 `*Controller.java` 静态提取并做双向差集校验（104 = 104），非计划值。

    **本次（2.3.0）新增系统管理域**：moyue-platform 在 `/api/v1/admin/system/**` 下新增
    25 个运营后台 RBAC 端点（部门 / 菜单 / 角色 / 用户四类 CRUD 及「角色-菜单」「用户-角色」
    两组绑定），并在 `/api/v1/system/login` 新增 1 个网关白名单免鉴权端点（BCrypt 校验后
    签发 role=3 令牌），合计 +26 → 130。以上为人工增量补充，未重跑静态提取脚本。

    **模块收敛提示**：工程经一次模块收敛重构，原有 21 个 Maven 模块合并为 9 个
    （3 个基础层 + 6 个业务域服务）。**HTTP 路径完全未变**，故本契约的 `paths` 不受影响；
    仅 `tags` 中的服务名与端口已同步为合并后拓扑：
    `moyue-account`(8081) / `moyue-content`(8082) / `moyue-social`(8083) /
    `moyue-commerce`(8084) / `moyue-platform`(8086) / `moyue-ai`(8097)。

    约定：
    - 统一响应体 `R<T>` = `{ code, message, data, traceId }`，**HTTP 一律 200 承载**，
      业务结果用 `code` 表达（0 成功，其余见 `ResultCode`）。
    - 鉴权：`Authorization: Bearer {accessToken}`；网关校验后向下游注入
      `X-User-Id` / `X-User-Role`（1 读者 / 2 作者 / 3 管理员）。
      **写接口的身份一律取注入头，不接受请求体传 userId。**
    - `/admin/**` 由 `AdminRoleInterceptor` 在服务端断言 `X-User-Role=3`。
    - `/internal/**` 为**服务间端点**，不在网关任何路由内，仅供 Feign 调用。
    - 分页参数 `page` / `size`；错误码 0 / 10001 / 10002 / 10003 / 20001 / 30001 / 40001 / 50001。
    - **例外**：`GET /admin/stats/export` 刻意**不走 `R<T>` 信封**，直接返回 `text/csv` 字节流
      （带 UTF-8 BOM 与 `Content-Disposition`），以便浏览器触发下载。前端需按二进制处理。

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发（经网关）
  - url: https://api.moyue.com/api/v1
    description: 生产环境
  - url: https://staging-api.moyue.com/api/v1
    description: 预发环境

tags:
  - name: auth
    description: 鉴权（moyue-account 8081）
  - name: user
    description: 用户资料（moyue-account 8081）
  - name: book
    description: 书城与作品管理（moyue-content 8082）
  - name: chapter
    description: 章节与创作（moyue-content 8082）
  - name: read
    description: 书架与阅读进度（moyue-content 8082）
  - name: comment
    description: 评论（moyue-social 8083）
  - name: im
    description: 即时通讯（moyue-social 8083）
  - name: blog
    description: 博客空间（moyue-social 8083）
  - name: points
    description: 积分商城（moyue-commerce 8084）
  - name: author
    description: 作者稿酬（moyue-commerce 8084）
  - name: reward
    description: 打赏支付（moyue-platform 8086）
  - name: message
    description: 站内信（moyue-social 8083）
  - name: admin
    description: 管理后台（需 X-User-Role=3）
  - name: system
    description: 系统管理 RBAC（moyue-platform 8086，运营后台）
  - name: search
    description: 书籍搜索（moyue-content 8082，Elasticsearch）
  - name: ai
    description: AI 智能客服（moyue-ai 8097）
  - name: merch
    description: 商城周边（moyue-commerce 8084）
  - name: internal
    description: 服务间端点（不经网关）

security:
  - bearerAuth: []

paths:
  # ---------------- 鉴权 ----------------
  /auth/login:
    post:
      tags: [auth]
      summary: 手机号 + 密码登录，返回 accessToken / refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginReq" }
      responses:
        "200": { $ref: "#/components/responses/OkLogin" }

  /auth/register:
    post:
      tags: [auth]
      summary: 注册账号（BCrypt 加密写库）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 用 refreshToken 换取新的 accessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshReq" }
      responses:
        "200": { $ref: "#/components/responses/OkLogin" }

  /users/me:
    get:
      tags: [auth]
      summary: 当前登录用户资料（读网关注入的 X-User-Id）
      responses:
        "200": { $ref: "#/components/responses/OkUser" }

  # ---------------- 用户 ----------------
  /users:
    get:
      tags: [user]
      summary: 用户分页列表
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }

  /users/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [user]
      summary: 用户资料查询
      responses:
        "200": { $ref: "#/components/responses/OkUser" }
    put:
      tags: [user]
      summary: 更新资料（昵称 / 头像）——仅本人或管理员；不允许改手机号 / 角色 / 状态
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileReq" }
      responses:
        "200": { $ref: "#/components/responses/OkUser" }

  # ---------------- 作品 ----------------
  /books:
    get:
      tags: [book]
      summary: 书籍分页（经 Feign 解析作者昵称）
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }
    post:
      tags: [book]
      summary: 创建作品（需 X-User-Role≥2；authorId 取注入头，不接受请求体传入）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /books/mine:
    get:
      tags: [book]
      summary: 我的作品（作者后台作品管理页的地基；authorId 取网关注入头，前端无法伪造）
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }

  /books/{bookId}:
    parameters:
      - { $ref: "#/components/parameters/BookId" }
    get:
      tags: [book]
      summary: 书籍详情
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    put:
      tags: [book]
      summary: 编辑作品（上架 / 下架用 status）——作者本人或管理员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBookReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    delete:
      tags: [book]
      summary: 删除作品（逻辑删除）——作者本人或管理员
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /books/{bookId}/cover:
    post:
      tags: [book]
      summary: 上传作品封面（multipart/form-data，字段名 file）——作者本人或管理员
      description: |
        返回更新后的作品 DTO，前端直接取 `coverUrl` 回显。
        上传目录由 `moyue.storage.*` 配置，单文件上限 10MB（`spring.servlet.multipart`）。
        落盘后的静态资源经 `/api/v1/files/**` 公开只读访问（网关白名单，不校验 token）。
      parameters:
        - { $ref: "#/components/parameters/BookId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 封面图片（PNG / JPEG / WEBP）
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /books/{bookId}/finish-apply:
    post:
      tags: [book]
      summary: 提交作品完结申请（作者本人）
      description: |
        申请经后台审核通过后作品才置为已完结（status=2）。
        同一作品重复提交时，Service 侧会拦截已有「待审」申请。
      parameters:
        - { $ref: "#/components/parameters/BookId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: 完结理由，可空 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    get:
      tags: [book]
      summary: 查询本人作品最新一条完结申请
      description: |
        无申请记录时返回 `code=20001`（资源不存在）；
        申请人非本人时返回 `code=10003`（无权限）。
      parameters:
        - { $ref: "#/components/parameters/BookId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/books/finish-applies:
    get:
      tags: [admin, book]
      summary: 完结申请分页（status 为空不过滤）
      parameters:
        - { name: status, in: query, required: false, schema: { type: integer }, description: 0 待审 / 1 通过 / 2 驳回 }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }

  /admin/books/finish-applies/{id}/approve:
    put:
      tags: [admin, book]
      summary: 通过完结申请（通过即把作品置为已完结 status=2）
      description: 操作人取网关注入的 `X-User-Id`，解析失败留空但不阻断裁决。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: remark, in: query, required: false, schema: { type: string }, description: 审核备注 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/books/finish-applies/{id}/reject:
    put:
      tags: [admin, book]
      summary: 驳回完结申请
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: remark, in: query, required: false, schema: { type: string }, description: 驳回理由 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 章节 ----------------
  /chapters:
    get:
      tags: [chapter]
      summary: 章节目录分页（按 chapterNo 升序）
      parameters:
        - { name: bookId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }
    post:
      tags: [chapter]
      summary: 创建章节（序号为空则取 max+1；wordCount 由正文长度推导）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChapterReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /chapters/drafts:
    get:
      tags: [chapter]
      summary: 草稿箱（status=0）
      parameters:
        - { name: bookId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }

  /chapters/{chapterId}:
    parameters:
      - { $ref: "#/components/parameters/ChapterId" }
    get:
      tags: [chapter]
      summary: 章节详情（含正文 content）
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    put:
      tags: [chapter]
      summary: 编辑章节（仅更新非空字段；正文变更重算字数）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateChapterReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    delete:
      tags: [chapter]
      summary: 删除章节（逻辑删除）
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /chapters/{chapterId}/publish:
    parameters:
      - { $ref: "#/components/parameters/ChapterId" }
    post:
      tags: [chapter]
      summary: 发布 / 定时发布（publishTime 未到则置 status=1 待调度到点转 2）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                publishTime: { type: string, format: date-time }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /chapters/{chapterId}/order:
    parameters:
      - { $ref: "#/components/parameters/ChapterId" }
    put:
      tags: [chapter]
      summary: 章节排序（改 chapterNo，冲突返回 10001）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chapterNo]
              properties:
                chapterNo: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 书架 / 阅读 ----------------
  /read/bookshelf:
    post:
      tags: [read]
      summary: 加入书架（幂等：uk_user_book 冲突时复活软删行）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddShelfReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /read/bookshelf/{userId}:
    get:
      tags: [read]
      summary: 查询书架
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /read/bookshelf/{bookId}:
    delete:
      tags: [read]
      summary: 移出书架（逻辑删除）
      parameters:
        - { $ref: "#/components/parameters/BookId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /read/bookshelf/{bookId}/progress:
    put:
      tags: [read]
      summary: 更新阅读进度（最后阅读章节）
      parameters:
        - { $ref: "#/components/parameters/BookId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lastChapterId: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 评论 ----------------
  /comments:
    get:
      tags: [comment]
      summary: 评论查询（按 bookId 分页）
      parameters:
        - { name: bookId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }
    post:
      tags: [comment]
      summary: 发表评论（评论人取 X-User-Id，默认 status=0 待审）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /comments/{commentId}:
    delete:
      tags: [comment]
      summary: 删除评论（评论人本人 / 管理员）
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /comments/{commentId}/like:
    post:
      tags: [comment]
      summary: 点赞切换（comment_like 唯一键防重；计数走原子 setSql，返回当前点赞数）
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- IM ----------------
  /im/conversations:
    get:
      tags: [im]
      summary: 我的会话列表（分页）
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }
    post:
      tags: [im]
      summary: 创建会话（单聊 type=1 / 群聊 type=2）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:      { type: integer, enum: [1, 2] }
                title:     { type: string }
                memberIds: { type: array, items: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /im/conversations/{conversationId}:
    get:
      tags: [im]
      summary: 会话详情（聚合成员 ID）
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /im/conversations/{conversationId}/messages:
    parameters:
      - { $ref: "#/components/parameters/ConversationId" }
    get:
      tags: [im]
      summary: 会话消息分页
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }
    post:
      tags: [im]
      summary: 发送消息（落库后经 WebSocket 广播；推送失败仅记日志不阻断 HTTP）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 2000 }
                type:    { type: integer, enum: [1, 2, 3], description: 1 文本 / 2 图片 / 3 系统 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 博客 ----------------
  /blog/posts:
    get:
      tags: [blog]
      summary: 文章列表（authorId 可选）
      parameters:
        - { name: authorId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }
    post:
      tags: [blog]
      summary: 发布文章
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePostReq" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /blog/posts/{id}:
    parameters:
      - { $ref: "#/components/parameters/PostId" }
    get:
      tags: [blog]
      summary: 文章详情（view_count 自增）
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    put:
      tags: [blog]
      summary: 编辑文章
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:    { type: string }
                coverUrl: { type: string }
                summary:  { type: string }
                content:  { type: string }
                status:   { type: integer, enum: [0, 1, 2] }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    delete:
      tags: [blog]
      summary: 删除文章（逻辑删除）
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /blog/posts/{id}/comments:
    parameters:
      - { $ref: "#/components/parameters/PostId" }
    get:
      tags: [blog]
      summary: 文章评论列表
      responses:
        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [blog]
      summary: 评论文章
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /blog/posts/{id}/like:
    parameters:
      - { $ref: "#/components/parameters/PostId" }
    post:
      tags: [blog]
      summary: 点赞 / 取消点赞（blog_like 唯一键防重，幂等切换）
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 积分商城 ----------------
  /points/accounts/{userId}:
    get:
      tags: [points]
      summary: 积分账户（不存在自动初始化）
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /points/products:
    get:
      tags: [points]
      summary: 上架商品列表
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /points/orders:
    get:
      tags: [points]
      summary: 我的兑换订单
      responses:

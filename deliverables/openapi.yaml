        "200": { $ref: "#/components/responses/Ok" }
    post:
      tags: [merch]
      summary: 加入购物车（重复加入数量累加；软删行复活）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, productId]
              properties:
                userId: { type: integer, format: int64 }
                productId: { type: integer, format: int64 }
                quantity: { type: integer, default: 1 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /merch/cart/{productId}:
    delete:
      tags: [merch]
      summary: 移出购物车（逻辑删除）
      parameters:
        - { name: userId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: productId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /merch/orders:
    get:
      tags: [merch]
      summary: 某用户订单列表（一行一商品，分页）
      parameters:
        - { name: userId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }
    post:
      tags: [merch]
      summary: 结算购物车（一次结算一个 order_no，按购物车行拆单；条件原子扣库存防超卖）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /merch/orders/{orderNo}/pay:
    post:
      tags: [merch]
      summary: 订单支付（幂等：status 0→1 条件更新）
      parameters:
        - { name: orderNo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 积分：获取渠道（P1-10） ----------------
  /points/check-in:
    post:
      tags: [points]
      summary: 每日签到（一天一次，+10 分；重复签到返回 10001）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /points/flows:
    get:
      tags: [points]
      summary: 积分流水（分页；bizType 1 签到 / 2 阅读时长 / 3 评论奖励 / 4 系统发放 / 5 兑换消费）
      parameters:
        - { name: userId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { $ref: "#/components/responses/OkPage" }

  /read/duration:
    post:
      tags: [read]
      summary: 阅读时长上报（每 10 分钟奖 1 积分，单次上限 120 分钟；奖励失败不阻断）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId: { type: integer, format: int64 }
                minutes: { type: integer, minimum: 1, maximum: 120 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 打赏：稿酬汇总（16-24） ----------------
  /rewards/income/summary:
    get:
      tags: [reward]
      summary: 稿酬汇总（累计 + 本月，数据库层 SUM）
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 站内信：标记已读（16-22） ----------------
  /messages/{noticeId}/read:
    put:
      tags: [message]
      summary: 标记单条通知已读（仅归属人；重复标记幂等）
      parameters:
        - { name: noticeId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /messages/users/{userId}/read-all:
    put:
      tags: [message]
      summary: 全部标记已读（数据库层原子更新，返回已读条数；仅本人）
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- IM：撤回 / 已读回执（P1-11） ----------------
  /im/messages/{messageId}/recall:
    put:
      tags: [im]
      summary: 撤回消息（仅发送者本人、2 分钟时间窗内；逻辑删除）
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /im/conversations/{conversationId}/read:
    put:
      tags: [im]
      summary: 已读回执（推进 last_read_message_id + 他人未读消息置已读，返回置读条数）
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /im/conversations/{conversationId}/unread:
    get:
      tags: [im]
      summary: 会话未读数（last_read_message_id 之后、非本人发送的消息条数）
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: userId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  # ---------------- 审核意见落库（16-20/21，参数扩展不新增路径） ----------------

  /internal/points/award:
    post:
      tags: [internal]
      summary: "[内部] 积分发放（阅读时长 / 评论奖励等生产者调用；返回新余额）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, bizType, points]
              properties:
                userId: { type: integer, format: int64 }
                bizType: { type: integer, enum: [1, 2, 3, 4, 5], description: 1 签到 / 2 阅读时长 / 3 评论奖励 / 4 系统发放 / 5 兑换消费 }
                points: { type: integer }
                remark: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /internal/search/books/_index:
    post:
      tags: [internal]
      summary: "[内部] 书籍索引进 ES（幂等覆盖，book 服务内容变更后推送）"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId]
              properties:
                bookId: { type: integer, format: int64 }
                title: { type: string }
                authorName: { type: string }
                categoryName: { type: string }
                description: { type: string }
                status: { type: integer, description: 与书籍状态一致，仅 1/2 可被检索 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /internal/search/books/{bookId}:
    delete:
      tags: [internal]
      summary: "[内部] 从 ES 移除书籍索引（书籍下架时推送）"
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        网关 JwtAuthGlobalFilter 校验 Authorization: Bearer <accessToken>，
        校验通过后向下游注入 X-User-Id / X-User-Role 头。

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      required: false
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Id:
      name: id
      in: path
      required: true
      description: 资源主键（雪花 ID）
      schema: { type: integer, format: int64 }
    BookId:
      name: bookId
      in: path
      required: true
      description: 作品 ID
      schema: { type: integer, format: int64 }
    ChapterId:
      name: chapterId
      in: path
      required: true
      description: 章节 ID
      schema: { type: integer, format: int64 }
    PostId:
      name: postId
      in: path
      required: true
      description: 帖子 ID
      schema: { type: integer, format: int64 }
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: 会话 ID
      schema: { type: integer, format: int64 }
    OrderNo:
      name: orderNo
      in: path
      required: true
      description: 打赏订单号（RW + 14 位时间戳 + 8 位随机）
      schema: { type: string }
      example: RW2026091212000012345678

  responses:
    Ok:
      description: >-
        统一响应。HTTP 状态码恒为 200，业务结果由 body 中的 code 表达：
        0 成功；10001 参数错误；10002 未认证；10003 无权限；20001 资源不存在；
        30001 频率限制；40001 服务内部错误；50001 支付失败。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/R" }
    OkPage:
      description: 统一响应，data 为分页结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/PageResult" }
    OkLogin:
      description: 统一响应，data 为令牌对
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/LoginVO" }
    OkAdminLogin:
      description: 统一响应，data 为后台登录令牌对（role 恒为 3）
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/AdminLoginVO" }
    OkUser:
      description: 统一响应，data 为用户资料
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/R"
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/UserInfo" }

  schemas:
    R:
      type: object
      description: 全局统一响应包装 R<T>
      properties:
        code:
          type: integer
          format: int32
          description: 0 成功，其余见 ResultCode
          example: 0
        message:
          type: string
          description: 提示信息，成功时为 ok
          example: ok
        data:
          description: 业务数据，类型随接口而定
          nullable: true
        traceId:
          type: string
          description: 链路追踪 ID
      required: [code, message]

    PageResult:
      type: object
      description: MyBatis-Plus 分页结果
      properties:
        records:
          type: array
          items: {}
        total:
          type: integer
          format: int64
          example: 128
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 10

    LoginReq:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
          example: "13800000000"
        password: { type: string, format: password, example: "Pass@1234" }

    RegisterReq:
      type: object
      required: [phone, code, password]
      properties:
        phone: { type: string, pattern: "^1[3-9][0-9]{9}$", example: "13800000000" }
        code: { type: string, example: "123456" }
        password: { type: string, format: password, example: "Pass@1234" }

    RefreshReq:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LoginVO:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    UserInfo:
      type: object
      description: 用户资料（手机号/角色/状态不可通过更新接口自改）
      properties:
        id: { type: integer, format: int64 }
        phone: { type: string }
        nickname: { type: string }
        role: { type: integer, description: "1 读者 / 2 作者 / 3 管理员", enum: [1, 2, 3] }
        status: { type: integer, description: "0 禁用 / 1 正常", enum: [0, 1] }
        avatarUrl: { type: string }

    UpdateProfileReq:
      type: object
      properties:
        nickname: { type: string, example: "墨小阅" }
        avatarUrl: { type: string, example: "https://cdn.moyue.com/a.png" }

    CreateBookReq:
      type: object
      required: [title, categoryId]
      properties:
        title: { type: string }
        coverUrl: { type: string }
        categoryId: { type: integer, format: int64 }
        tags: { type: string, description: "逗号分隔" }
        intro: { type: string }

    UpdateBookReq:
      type: object
      properties:
        title: { type: string }
        coverUrl: { type: string }
        categoryId: { type: integer, format: int64 }
        tags: { type: string }
        intro: { type: string }
        status: { type: integer, description: "1 连载中 / 2 已完结 / 3 已下架", enum: [1, 2, 3] }

    CreateChapterReq:
      type: object
      required: [title, content]
      properties:
        bookId: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        chapterNo: { type: integer }
        status: { type: integer, description: "1 草稿 / 2 已发布 / 3 已驳回", enum: [1, 2, 3] }

    UpdateChapterReq:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
        chapterNo: { type: integer }
        status: { type: integer, enum: [1, 2, 3] }
        publishTime: { type: string, format: date-time }

    CreateCommentReq:
      type: object
      required: [content]
      properties:
        bookId: { type: integer, format: int64 }
        chapterId: { type: integer, format: int64 }
        content: { type: string }

    CreateRewardReq:
      type: object
      required: [amount]
      properties:
        bookId: { type: integer, format: int64 }
        chapterId: { type: integer, format: int64 }
        amount:
          type: number
          format: double
          minimum: 0.01
          maximum: 100000
          description: 打赏金额，服务端以 BigDecimal setScale(2, HALF_UP) 落库
          example: 6.66
        payChannel:
          type: integer
          description: "1 微信 / 2 支付宝（后端 RewardOrderEntity 仅定义这两个渠道，暂无余额渠道）"
          enum: [1, 2]
          default: 1

    AnnouncementReq:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        type: { type: integer, description: "1 站内公告 / 2 活动 / 3 系统维护", enum: [1, 2, 3], default: 1 }
        status: { type: integer, description: "0 草稿 / 1 已发布 / 2 已下线", enum: [0, 1, 2], default: 0 }
        isTop: { type: integer, description: "0 否 / 1 置顶", enum: [0, 1], default: 0 }

    PointsProductReq:
      type: object
      required: [name, costPoints]
      properties:
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        costPoints: { type: integer, minimum: 1 }
        stock: { type: integer, minimum: 0 }
        status: { type: integer, description: "1 上架 / 2 下架", enum: [1, 2], default: 1 }

    CreatePostReq:
      type: object
      required: [title, content]
      properties:
        authorId: { type: integer, format: int64 }
        title: { type: string }
        coverUrl: { type: string }
        summary: { type: string }
        content: { type: string }
        status: { type: integer, description: "0 草稿 / 1 已发布", enum: [0, 1], default: 1 }

    CreatePointsOrderReq:
      type: object
      required: [userId, productId]
      properties:
        userId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }

    AddShelfReq:
      type: object
      required: [bookId]
      properties:
        bookId: { type: integer, format: int64 }
        chapterId: { type: integer, format: int64 }

    # ---------------- 系统管理 RBAC 请求体 ----------------
    DeptReq:
      type: object
      description: 部门请求体（字段均可选，编辑时仅更新非空字段）
      properties:
        parentId: { type: integer, format: int64, description: 父部门 ID，空则挂在根 }
        deptName: { type: string, example: "技术部" }
        orderNum: { type: integer, description: 排序号（同级升序） }
        leader: { type: string, description: 负责人 }
        phone: { type: string, description: 联系电话 }
        email: { type: string, description: 邮箱 }
        status: { type: integer, description: "0 禁用 / 1 正常", enum: [0, 1] }

    MenuReq:
      type: object
      description: 菜单请求体（字段均可选）
      properties:
        parentId: { type: integer, format: int64, description: 父菜单 ID，空则挂在根目录 }
        menuName: { type: string, example: "用户管理" }
        menuType: { type: integer, description: "0 目录 / 1 菜单 / 2 按钮", enum: [0, 1, 2] }
        path: { type: string, description: 路由路径（菜单/目录） }
        component: { type: string, description: 前端组件路径（菜单） }
        perms: { type: string, description: 权限标识（按钮，如 sys:user:add） }
        icon: { type: string, description: 图标 }
        orderNum: { type: integer, description: 排序号 }
        status: { type: integer, description: "0 禁用 / 1 正常", enum: [0, 1] }

    RoleReq:
      type: object
      description: 角色请求体（字段均可选）
      properties:
        roleName: { type: string, example: "内容运营" }
        roleKey: { type: string, description: 角色标识（唯一，如 content_op） }
        dataScope: { type: integer, description: "数据权限范围：1 全部 / 2 自定义部门", enum: [1, 2] }
        deptIds: { type: string, description: 自定义数据范围部门 ID（逗号分隔，dataScope=2 时生效） }
        status: { type: integer, description: "0 禁用 / 1 正常", enum: [0, 1] }

    UserReq:
      type: object
      description: 用户请求体（编辑时 password 为空则不修改；roleIds 为空则不改动角色）
      properties:
        deptId: { type: integer, format: int64, description: 所属部门 ID }
        username: { type: string, example: "admin_zhang" }
        nickname: { type: string, example: "张老师" }
        password: { type: string, format: password, description: 明文，落库前 BCrypt 加密 }
        email: { type: string }
        phone: { type: string }
        status: { type: integer, description: "0 禁用 / 1 正常", enum: [0, 1] }
        roleIds: { type: array, items: { type: integer, format: int64 }, description: 角色 ID 列表 }

    MenuBindReq:
      type: object
      required: [menuIds]
      properties:
        menuIds: { type: array, items: { type: integer, format: int64 }, description: 授权的菜单 ID 列表 }

    RoleBindReq:
      type: object
      required: [roleIds]
      properties:
        roleIds: { type: array, items: { type: integer, format: int64 }, description: 分配的角色 ID 列表 }

    AdminLoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: "admin_zhang" }
        password: { type: string, format: password, example: "Pass@1234" }

    # ---------------- 系统管理 RBAC 响应视图 ----------------
    SysDept:
      type: object
      description: 部门实体（含递归 children；is_deleted 软删字段不对外暴露）
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        deptName: { type: string }
        orderNum: { type: integer }
        leader: { type: string }
        phone: { type: string }
        email: { type: string }
        status: { type: integer, description: "0 禁用 / 1 正常", enum: [0, 1] }
        children: { type: array, items: { $ref: "#/components/schemas/SysDept" }, description: 子部门（仅树型响应填充） }

    SysMenu:
      type: object
      description: 菜单实体（含递归 children）
      properties:
        id: { type: integer, format: int64 }
        parentId: { type: integer, format: int64 }
        menuName: { type: string }
        menuType: { type: integer, description: "0 目录 / 1 菜单 / 2 按钮", enum: [0, 1, 2] }
        path: { type: string }
        component: { type: string }
        perms: { type: string }
        icon: { type: string }
        orderNum: { type: integer }
        status: { type: integer, description: "0 禁用 / 1 正常", enum: [0, 1] }
        children: { type: array, items: { $ref: "#/components/schemas/SysMenu" }, description: 子菜单（仅树型响应填充） }

    SysRole:
      type: object
      description: 角色实体
      properties:
        id: { type: integer, format: int64 }
        roleName: { type: string }
        roleKey: { type: string, description: 角色标识（唯一） }
        dataScope: { type: integer, description: "1 全部 / 2 自定义部门", enum: [1, 2] }
        deptIds: { type: string, description: 自定义数据范围部门 ID（逗号分隔） }
        status: { type: integer, description: "0 禁用 / 1 正常", enum: [0, 1] }

    SysUser:
      type: object
      description: 系统用户视图（屏蔽 password 哈希）
      properties:
        id: { type: integer, format: int64 }
        deptId: { type: integer, format: int64 }

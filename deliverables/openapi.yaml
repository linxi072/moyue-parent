        - { name: status, in: query, schema: { type: integer, enum: [0, 1, 2, 3] } }
      responses:
        "200": { $ref: "#/components/responses/Ok" }

  /admin/audit/tasks/{taskId}/approve:
    put:
      tags: [admin]

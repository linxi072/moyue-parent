server:
  port: 8080

spring:
  application:
    name: moyue-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      # 不启用自动路由发现，使用下方显式 lb:// 路由（更可控）
      discovery:
        locator:
          enabled: false
      # 跨域：允许前端 5173 访问
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # 服务发现路由：uri 使用 lb://<服务名>，由 Nacos 解析实例
      routes:
        # 1) 鉴权服务（含 /api/v1/users/me，必须排在 user 路由之前，
        #    否则 /users/me 会被下方 /api/v1/users/** 截走导致 404）
        - id: moyue-auth
          uri: lb://moyue-auth
          predicates:
            - Path=/api/v1/auth/**
            - Path=/api/v1/users/me
        # 2) 用户服务（用户资料 / 分页）
        - id: moyue-user
          uri: lb://moyue-user
          predicates:
            - Path=/api/v1/users/**
        # 3) 书城服务
        - id: moyue-book
          uri: lb://moyue-book
          predicates:
            - Path=/api/v1/books/**
        # 4) 阅读 / 书架
        - id: moyue-read
          uri: lb://moyue-read
          predicates:
            - Path=/api/v1/read/**
        # 5) 章节
        - id: moyue-chapter
          uri: lb://moyue-chapter
          predicates:
            - Path=/api/v1/chapters/**
        # 6) 作者稿酬
        - id: moyue-author
          uri: lb://moyue-author
          predicates:
            - Path=/api/v1/author/**
        # 7) 评论
        - id: moyue-comment
          uri: lb://moyue-comment
          predicates:
            - Path=/api/v1/comments/**
        # 8) 审核（admin，前缀较具体，排在 operation / stat 之前）
        - id: moyue-audit
          uri: lb://moyue-audit
          predicates:
            - Path=/api/v1/admin/audit/**
        # 9) 运营（公告 / 对账）
        - id: moyue-operation
          uri: lb://moyue-operation
          predicates:
            - Path=/api/v1/admin/announcements/**
            - Path=/api/v1/admin/orders/**
        # 10) 统计（admin）
        - id: moyue-stat
          uri: lb://moyue-stat
          predicates:
            - Path=/api/v1/admin/stats/**
        # 11) 站内消息
        - id: moyue-message
          uri: lb://moyue-message
          predicates:
            - Path=/api/v1/messages/**
        # 12) 即时通讯（单聊 / 群聊）
        - id: moyue-im
          uri: lb://moyue-im
          predicates:
            - Path=/api/v1/im/**
        # 13) 积分商城
        - id: moyue-points
          uri: lb://moyue-points
          predicates:
            - Path=/api/v1/points/**
            - Path=/api/v1/admin/points/**
        # 14) 博客空间
        - id: moyue-blog
          uri: lb://moyue-blog
          predicates:
            - Path=/api/v1/blog/**

# JWT 密钥：与 moyue-auth 保持一致（共享密钥，网关与鉴权服务使用同一值）
moyue:
  jwt:
    secret: "moyue-jwt-dev-secret-key-0123456789abcdefghij"

logging:
  level:
    com.moyue: INFO

server:
  port: 8080

spring:
  application:
    name: moyue-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      # 不启用自动路由发现，使用下方显式 lb:// 路由（更可控）
      discovery:
        locator:
          enabled: false
      # 跨域：允许前端 5173 访问
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # 服务发现路由：uri 使用 lb://<服务名>，由 Nacos 解析实例
      # RuoYi 目录风格重构后共 10 个业务服务：auth(8090) / account(8081) / content(8082) /
      # social(8083) / commerce(8084) / search(8085) / system(8086) / message(8087) / risk(8089) / ai(8097)
      routes:
        # ===== auth（独立认证：登录 / 注册 / 刷新）=====
        - id: moyue-auth
          uri: lb://moyue-auth
          predicates:
            - Path=/api/v1/auth/**

        # ===== account（账号域：用户资料）=====
        - id: moyue-user
          uri: lb://moyue-account
          predicates:
            - Path=/api/v1/users/**

        # ===== content（内容域：书城 / 章节 / 阅读 / 静态资源）=====
        # C1) 书城（含后台完结申请审核 /api/v1/admin/books/**）
        - id: moyue-book
          uri: lb://moyue-content
          predicates:
            - Path=/api/v1/books/**,/api/v1/admin/books/**
        # C2) 书城静态资源（封面等上传文件，公网只读，白名单前缀放行）
        - id: moyue-book-files
          uri: lb://moyue-content
          predicates:
            - Path=/api/v1/files/**
        # C3) 阅读 / 书架
        - id: moyue-read
          uri: lb://moyue-content
          predicates:
            - Path=/api/v1/read/**
        # C4) 章节
        - id: moyue-chapter
          uri: lb://moyue-content
          predicates:
            - Path=/api/v1/chapters/**

        # ===== search（检索域：全文检索 / 推荐位，只读 ES；含管理端客服知识检索与索引重建）=====
        - id: moyue-search
          uri: lb://moyue-search
          predicates:
            - Path=/api/v1/search/**,/api/v1/admin/search/**

        # ===== social（社区域：评论 / 博客 / IM）=====
        - id: moyue-comment
          uri: lb://moyue-social
          predicates:
            - Path=/api/v1/comments/**
        - id: moyue-blog
          uri: lb://moyue-social
          predicates:
            - Path=/api/v1/blog/**
        - id: moyue-im
          uri: lb://moyue-social
          predicates:
            - Path=/api/v1/im/**

        # ===== social（P2-E 社区关注流 / 动态：关注 / 取关 / 关注列表 / 粉丝列表 / feed 时间线 / 作者主页动态）=====
        # 注意：内部端点 /api/v1/internal/** 不在此暴露（不经网关，由业务侧 InternalAuthInterceptor 校验 X-Service-Token），
        # 同一条断言内用逗号分隔多路径（OR），避免 AND 语义导致路径互斥永不匹配。
        - id: moyue-social-follow
          uri: lb://moyue-social
          predicates:
            - Path=/api/v1/follow/**,/api/v1/feed,/api/v1/dynamic/**

        # ===== message（触达域：站内信 / 触达记录）=====
        - id: moyue-message
          uri: lb://moyue-message
          predicates:
            - Path=/api/v1/messages/**
        - id: moyue-message-admin
          uri: lb://moyue-message
          predicates:
            - Path=/api/v1/admin/messages/**

        # ===== commerce（商业域：积分 / 商城 / 作者稿酬）=====
        - id: moyue-author
          uri: lb://moyue-commerce
          predicates:
            - Path=/api/v1/author/**
        # 注意：同一 route 下多条 - Path= 断言是 AND 关系（互斥路径永不匹配），
        # 多路径必须写在同一条断言内用逗号分隔（OR）。以下路由均按此规则修正。
        - id: moyue-points
          uri: lb://moyue-commerce
          predicates:
            - Path=/api/v1/points/**,/api/v1/admin/points/**
        - id: moyue-merch
          uri: lb://moyue-commerce
          predicates:
            - Path=/api/v1/merch/**,/api/v1/admin/merch/**

        # ===== risk（内容安全域：审核 / 举报 / 敏感词）=====
        - id: moyue-audit
          uri: lb://moyue-risk
          predicates:
            - Path=/api/v1/admin/audit/**
        - id: moyue-risk-admin
          uri: lb://moyue-risk
          predicates:
            - Path=/api/v1/admin/reports/**,/api/v1/admin/risk/**
        - id: moyue-report
          uri: lb://moyue-risk
          predicates:
            - Path=/api/v1/reports/**

        # ===== system（平台运营域：公告 / 对账 / 统计 / RBAC / 打赏）=====
        - id: moyue-operation
          uri: lb://moyue-system
          predicates:
            - Path=/api/v1/admin/announcements/**,/api/v1/admin/orders/**
        - id: moyue-stat
          uri: lb://moyue-system
          predicates:
            - Path=/api/v1/admin/stats/**
        - id: moyue-reward
          uri: lb://moyue-system
          predicates:
            - Path=/api/v1/rewards/**
        - id: moyue-system
          uri: lb://moyue-system
          predicates:
            - Path=/api/v1/admin/system/**
        - id: moyue-system-login
          uri: lb://moyue-system
          predicates:
            - Path=/api/v1/system/login

        # ===== system（P0-1 稿酬结算打款闭环）=====
        # 作者端结算单发起 / 管理端审核打款 / 运营买断稿酬录入，均路由到 moyue-system。
        # 注意：同一 route 下多个 - Path= 断言是 AND 关系（互斥路径永不匹配），
        # 多路径必须写在同一条断言内用逗号分隔（OR），与 moyue-search 写法一致。
        - id: moyue-settlement
          uri: lb://moyue-system
          predicates:
            - Path=/api/v1/settlements/**,/api/v1/admin/settlements/**,/api/v1/admin/author-incomes/**

        # ===== ai（智能域：AI 智能客服，独立服务）=====
        - id: moyue-ai
          uri: lb://moyue-ai
          predicates:
            - Path=/api/v1/ai/**

        # ===== 契约文档聚合（dev 内部用；prod 由 SPRINGDOC_ENABLED 整体关闭；免鉴权见下方 whitelist-prefixes）=====
        # 10 个服务各一条：/api/v1/docs/<svc>/** → RewritePath 去前缀 → lb://moyue-<svc>
        - id: moyue-docs-system
          uri: lb://moyue-system
          predicates:
            - Path=/api/v1/docs/system/**
          filters:
            - RewritePath=/api/v1/docs/system/(?<seg>.*), /$\{seg}
        - id: moyue-docs-auth
          uri: lb://moyue-auth
          predicates:
            - Path=/api/v1/docs/auth/**
          filters:
            - RewritePath=/api/v1/docs/auth/(?<seg>.*), /$\{seg}
        - id: moyue-docs-account
          uri: lb://moyue-account
          predicates:
            - Path=/api/v1/docs/account/**
          filters:
            - RewritePath=/api/v1/docs/account/(?<seg>.*), /$\{seg}
        - id: moyue-docs-content
          uri: lb://moyue-content
          predicates:
            - Path=/api/v1/docs/content/**
          filters:
            - RewritePath=/api/v1/docs/content/(?<seg>.*), /$\{seg}
        - id: moyue-docs-social
          uri: lb://moyue-social
          predicates:
            - Path=/api/v1/docs/social/**
          filters:
            - RewritePath=/api/v1/docs/social/(?<seg>.*), /$\{seg}
        - id: moyue-docs-commerce
          uri: lb://moyue-commerce
          predicates:
            - Path=/api/v1/docs/commerce/**
          filters:
            - RewritePath=/api/v1/docs/commerce/(?<seg>.*), /$\{seg}
        - id: moyue-docs-search
          uri: lb://moyue-search
          predicates:
            - Path=/api/v1/docs/search/**
          filters:
            - RewritePath=/api/v1/docs/search/(?<seg>.*), /$\{seg}
        - id: moyue-docs-message
          uri: lb://moyue-message
          predicates:
            - Path=/api/v1/docs/message/**
          filters:
            - RewritePath=/api/v1/docs/message/(?<seg>.*), /$\{seg}
        - id: moyue-docs-risk
          uri: lb://moyue-risk
          predicates:
            - Path=/api/v1/docs/risk/**
          filters:
            - RewritePath=/api/v1/docs/risk/(?<seg>.*), /$\{seg}
        - id: moyue-docs-ai
          uri: lb://moyue-ai
          predicates:
            - Path=/api/v1/docs/ai/**
          filters:
            - RewritePath=/api/v1/docs/ai/(?<seg>.*), /$\{seg}

# JWT 密钥与认证白名单（配置化，对齐 RuoYi gateway ignore 白名单模式）
moyue:
  auth:
    # 免鉴权精确路径（逗号分隔）
    whitelist: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/system/login
    # 免鉴权前缀（公开静态资源 + 契约文档聚合，dev 内部用）
    whitelist-prefixes: /api/v1/files/,/api/v1/docs/
  jwt:
    # P2-17：密钥环境变量化（dev 保留本地默认值；test/prod 必须注入 MOYUE_JWT_SECRET，不带明文默认）
    secret: ${MOYUE_JWT_SECRET:moyue-jwt-dev-secret-key-0123456789abcdefghij}
  security:
    # P2-I 网关直连防护：允许直连业务端口的来源网段（CIDR，逗号分隔）。
    # 留空（dev/test 默认）= 过滤器 no-op，便于本地与 H2 测试；生产由运维填入网关网段 + 集群 Pod/子网 CIDR。
    allowGatewayCidr: ""
    # P2-I(P1) 网关信任头 HMAC 签名密钥；留空则不签名（no-op），生产必填并与业务侧 gatewaySigSecret 一致。
    gatewaySigSecret: ""

logging:
  level:
    com.moyue: INFO

# 集成测试环境（moyue-points）：
# - 关闭 Nacos 注册与发现，测试上下文不依赖注册中心
# - 数据源由 Testcontainers @ServiceConnection 注入（mysql:8.0 容器）
# - Flyway 在容器 MySQL 上执行 moyue-common 的 V1–V6 迁移建全表
# - Redis 自动配置为惰性连接，测试链路（账户/商品/兑换）不触碰 Redis，无需真实实例
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

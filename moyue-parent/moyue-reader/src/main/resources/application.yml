server:
  port: 8091

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue-reader
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moyue}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 账号口令不设明文默认值，强制由环境变量注入（dev 默认值下沉 application-dev.yml）
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # 检索：Elasticsearch（原 moyue-search，索引 moyue_book，只读）
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  # 邮件渠道（P2-14）：SMTP 全可配；dev 默认指向 MailHog（localhost:1025，无认证、无 TLS）
  mail:
    host: ${MOYUE_MAIL_HOST:localhost}
    port: ${MOYUE_MAIL_PORT:1025}
    username: ${MOYUE_MAIL_USERNAME:}
    password: ${MOYUE_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

moyue:
  # P2-16：Redis 缓存总开关（置 false 即全站关闭缓存，自动回源数据库）
  cache:
    enabled: true
  # 检索域参数（与 com.moyue.search 配置类对应）
  search:
    index-name: ${MOYUE_SEARCH_INDEX:moyue_book}
    default-page-size: ${MOYUE_SEARCH_PAGE_SIZE:20}
    recommend:
      max-limit: ${MOYUE_SEARCH_RECOMMEND_MAX:50}
  # 邮件渠道业务参数（SMTP 连接由 spring.mail 提供）
  mail:
    host: ${MOYUE_MAIL_HOST:localhost}
    port: ${MOYUE_MAIL_PORT:1025}
    username: ${MOYUE_MAIL_USERNAME:}
    password: ${MOYUE_MAIL_PASSWORD:}
    from: ${MOYUE_MAIL_FROM:no-reply@moyue.local}

logging:
  level:
    com.moyue: INFO
    org.springframework.data.elasticsearch: WARN

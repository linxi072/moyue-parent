server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue-account
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moyue}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# MyBatis-Plus 配置前缀是根级 mybatis-plus，写在 spring 之下（spring.mybatis-plus）为无效配置、整段沉默失效
# 逻辑删除暂不启用全局配置：author_income/audit_task/notice 三表无 is_deleted 列，全局开启会导致 SELECT 拼错字段报错；
# 如需启用请先用 Flyway 补列，或对已具备列的实体单独加 @TableLogic
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      # logic-delete-field: isDeleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0


logging:
  level:
    com.moyue: INFO

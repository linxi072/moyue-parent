server:
  port: 8086

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${{MYSQL_HOST:localhost}}:${{MYSQL_PORT:3306}}/${{MYSQL_DB:moyue}}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 账号口令不设明文默认值，强制由环境变量注入（dev 默认值下沉 application-dev.yml）
    username: ${{MYSQL_USERNAME}}
    password: ${{MYSQL_PASSWORD}}
  cloud:
    nacos:
      discovery:
        server-addr: ${{NACOS_SERVER_ADDR:localhost:8848}}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
moyue:
  # P2-16：Redis 缓存总开关（置 false 即全站关闭缓存，自动回源数据库）
  cache:
    enabled: true

# XXL-Job 执行器配置（执行器随 moyue-system 进程启动，RPC 端口 9099）
xxl:
  job:
    admin:
      addresses: ${{XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}}
    accessToken: ${{XXL_JOB_ACCESS_TOKEN:}}
    executor:
      appname: moyue-job
      address: ""
      ip: ""
      port: 9099
      logpath: ./logs/xxl-job
      logretentiondays: 30
logging:
  level:
    com.moyue: INFO

# reader prod 环境
# 敏感项（MYSQL_USERNAME / MYSQL_PASSWORD / MOYUE_JWT_SECRET 等）一律由环境变量注入，
# 本文件不提供任何明文默认值；本地开发默认值见 application-dev.yml。

# 生产关闭 API 文档（对外不暴露 swagger / openapi 端点）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产环境 XXL-Job Admin 代理账号由环境变量注入（XXL_JOB_ADMIN_USERNAME / XXL_JOB_ADMIN_PASSWORD）

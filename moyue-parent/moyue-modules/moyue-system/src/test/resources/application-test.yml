# 集成测试环境（moyue-system）：
# - 关闭 Nacos 注册与发现，测试上下文不依赖注册中心
# - 数据源为 H2 内存库（MySQL 兼容模式），替代 Testcontainers MySQL：
#   项目硬性约束禁用 Docker（见 docs/不可忽视条件.md），集成测试一律走 H2
# - Flyway 挂载 classpath:db/h2（由 tools/gen-h2-schema.py 从真实迁移脚本生成的 H2 等价 schema），
#   与生产的 classpath:db/migration 隔离：真实脚本含 MySQL 按表作用域的重名索引，
#   H2 索引名 schema 全局唯一会冲突，故测试侧用变换后的等价脚本
# - Redis 自动配置为惰性连接，测试链路不触碰 Redis，无需真实实例
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:moyue_system_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/h2

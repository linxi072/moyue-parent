server:
  port: 8082

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue-content
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${{MYSQL_HOST:localhost}}:${{MYSQL_PORT:3306}}/${{MYSQL_DB:moyue}}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 账号口令不设明文默认值，强制由环境变量注入（dev 默认值下沉 application-dev.yml）
    username: ${{MYSQL_USERNAME}}
    password: ${{MYSQL_PASSWORD}}
  data:
    redis:
      host: ${{REDIS_HOST:localhost}}
      port: ${{REDIS_PORT:6379}}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${{NACOS_SERVER_ADDR:localhost:8848}}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # 作品封面上传：与 moyue.storage.* 配套
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
moyue:
  cache:
    enabled: true
  # 文件存储：本地磁盘实现（生产替换为 OSS 实现即可，FileStorage 接口不变）
  storage:
    local:
      root: ./uploads
      url-prefix: /api/v1/files
    max-size-mb: 5
logging:
  level:
    com.moyue: INFO

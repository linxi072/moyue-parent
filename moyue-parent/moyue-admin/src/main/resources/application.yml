server:
  port: 8093

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moyue}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 账号口令不设明文默认值，强制由环境变量注入（dev 默认值下沉 application-dev.yml）
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# XXL-Job 执行器配置（原 moyue-job 模块配置，原样保留）
# 注：executor.appname 保持 moyue-job，调度中心「执行器管理」中已注册的 appname 无需变更；
#     执行器随 admin 进程（8093）启动，executor RPC 端口仍为 9099。
xxl:
  job:
    admin:
      # 调度中心地址：需单独启动 xuxueli/xxl-job-admin:2.4.0（见 README 的 docker 说明）
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: moyue-job
      address: ""
      ip: ""
      port: 9099
      logpath: ./logs/xxl-job
      logretentiondays: 30

moyue:
  cache:
    enabled: true

logging:
  level:
    com.moyue: INFO

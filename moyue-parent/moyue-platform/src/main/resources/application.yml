server:
  port: 8086

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moyue}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# MyBatis-Plus 配置前缀是根级 mybatis-plus，写在 spring 之下（spring.mybatis-plus）为无效配置、整段沉默失效
# 逻辑删除暂不启用全局配置：author_income/audit_task/notice 三表无 is_deleted 列，全局开启会导致 SELECT 拼错字段报错；
# 如需启用请先用 Flyway 补列，或对已具备列的实体单独加 @TableLogic
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      # logic-delete-field: isDeleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0

# XXL-Job 执行器配置（原 moyue-job 模块配置，合并后原样保留）
# 注：executor.appname 保持 moyue-job，调度中心「执行器管理」中已注册的 appname 无需变更；
#     合并后 xxl-job 执行器随 platform 进程（8086）启动，executor RPC 端口仍为 9099。
xxl:
  job:
    admin:
      # 调度中心地址：需单独启动 xuxueli/xxl-job-admin:2.4.0（见 README 的 docker 说明）
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8088/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: moyue-job
      address: ""
      ip: ""
      port: 9099
      logpath: ./logs/xxl-job
      logretentiondays: 30

logging:
  level:
    com.moyue: INFO

server:
  port: 8082

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue-content
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moyue}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  # Elasticsearch：全文检索（原 moyue-search，索引 moyue_book）
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  # 作品封面上传：与 moyue.storage.* 配套（原 moyue-book）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# MyBatis-Plus 配置前缀是根级 mybatis-plus，写在 spring 之下（spring.mybatis-plus）为无效配置、整段沉默失效
# 逻辑删除暂不启用全局配置：author_income/audit_task/notice 三表无 is_deleted 列，全局开启会导致 SELECT 拼错字段报错；
# 如需启用请先用 Flyway 补列，或对已具备列的实体单独加 @TableLogic
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      # logic-delete-field: isDeleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0

moyue:
  # P2-16：Redis 缓存总开关（置 false 即全站关闭缓存，自动回源数据库）
  # 由 moyue-common 的 MoyueCacheAutoConfiguration 消费；chapter / read 域的 @Cacheable / @CacheEvict 依赖它
  cache:
    enabled: true
  # 文件存储：本地磁盘实现（生产替换为 OSS 实现即可，FileStorage 接口不变）
  storage:
    local:
      root: ./uploads
      url-prefix: /api/v1/files
    max-size-mb: 5

logging:
  level:
    com.moyue: INFO
    org.springframework.data.elasticsearch: WARN

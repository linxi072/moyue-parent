server:
  port: 8081

spring:
  application:
    name: moyue-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/moyue?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: assign_id
        logic-delete-field: isDeleted
        logic-delete-value: 1
        logic-not-delete-value: 0
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT 配置：密钥与网关保持一致；accessToken TTL 2h，refreshToken TTL 7d
moyue:
  jwt:
    secret: "moyue-jwt-dev-secret-key-0123456789abcdefghij"
    access-ttl: 7200000
    refresh-ttl: 604800000
  # 演示账号：V2 种子不写密码，由本服务以 BCrypt 写入；id 固定为 1 以对齐 V2 种子引用
  demo:
    phone: "13800000000"
    password: "123456"
    nickname: "墨阅读者"
    role: 1

logging:
  level:
    com.moyue: INFO

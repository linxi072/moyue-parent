server:
  port: 8090

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: moyue-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:moyue}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 账号口令不设明文默认值，强制由环境变量注入（dev 默认值下沉 application-dev.yml）
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
moyue:
  # JWT 配置：密钥与网关保持一致；accessToken TTL 2h，refreshToken TTL 7d
  jwt:
    secret: ${MOYUE_JWT_SECRET:moyue-jwt-dev-secret-key-0123456789abcdefghij}
    access-ttl: 7200000
    refresh-ttl: 604800000
  # 演示账号：V2 种子不写密码，由本服务以 BCrypt 写入；id 固定为 1 以对齐 V2 种子引用
  demo:
    phone: "13800000000"
    password: "123456"
    nickname: "墨阅读者"
    role: 1
logging:
  level:
    com.moyue: INFO
